<a [routerLink]="['/products', product.id]" class="block border rounded-lg p-4 hover:shadow-lg transition">
  <img [src]="product.image" alt="{{ product.title }}" class="w-full h-48 object-contain mb-2" />
  <h3 class="font-semibold text-lg truncate">{{ product.title }}</h3>
  <p class="text-gray-500">{{ product.category }}</p>
  <p class="text-green-600 font-bold">${{ product.price }}</p>
</a>
