  <div class="min-h-[60vh] grid place-items-center p-6">
    <div class="w-full max-w-sm rounded-xl border border-white/10 bg-gray-900/40 p-5 backdrop-blur">
      <h1 class="text-xl font-semibold text-white mb-4">Login</h1>

      <form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-3">
        <div>
          <label class="block text-sm text-gray-300 mb-1">Username</label>
          <input formControlName="username" type="text"
                 class="w-full rounded-lg border border-white/10 bg-gray-800 px-3 py-2 text-white outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm text-gray-300 mb-1">Password</label>
          <input formControlName="password" type="password"
                 class="w-full rounded-lg border border-white/10 bg-gray-800 px-3 py-2 text-white outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <button [disabled]="loading()" type="submit"
                class="mt-2 inline-flex items-center justify-center rounded-md bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-500 disabled:opacity-60">
          {{ loading() ? 'Logging in…' : 'Login' }}
        </button>

        <p class="mt-2 text-sm text-gray-400">
          No account?
          <a routerLink="/auth/register" class="text-blue-400 hover:underline">Register</a>
        </p>

        @if(error()){<p class="text-sm text-red-400 mt-2">{{ error() }}</p>}
      </form>
    </div>
  </div>
