<div class="container mx-auto px-4 py-8">
  <!-- Header / Breadcrumb-ish -->
  <div class="mb-6 flex items-center justify-between">
    <h1 class="text-2xl sm:text-3xl font-bold">
      {{ formatCategory(cat()) }}
    </h1>

    <a routerLink="/all-products"
       class="text-sm font-medium text-indigo-400 hover:text-white transition-colors duration-200">
      Shop all ->
    </a>

  
  <!-- STATUS -->
  @if (isLoading()) {
    <p class="text-gray-500">Loading…</p>
  } @else if (error()) {
    <p class="text-red-500 font-medium">{{ error() }}</p>
  } @else if (!products().length) {
    <div class="rounded-lg border border-dashed p-8 text-center text-gray-400">
      No products found in this category.
    </div>
  } @else {
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-6">
      @for (p of products(); track p.id) {
        <app-product-card [product]="p" (add)="addToCart($event)"></app-product-card>
      }
    </div>
  }
</div>
