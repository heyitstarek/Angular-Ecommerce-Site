<div class="container mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold mb-6">All Products</h1>

  @if (isLoading()) {
    <p>Loading products...</p>
  } @else {
    @if (error()) {
      <p class="text-red-500">{{ error() }}</p>
    } @else {
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        @for (product of products(); track product.id) {
          <a
            [routerLink]="['/products', product.id]"
            class="block border rounded-lg p-4 shadow hover:shadow-lg transition"
          >
            <img
              [src]="product.image"
              [alt]="product.title"
              class="h-48 w-full object-contain mb-4"
            />
            <h2 class="font-semibold text-lg truncate" title="{{ product.title }}">
              {{ product.title }}
            </h2>
            <p class="text-gray-700">${{ product.price }}</p>
          </a>
        }
      </div>
    }
  }
</div>
