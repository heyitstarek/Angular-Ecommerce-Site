<div class="container mx-auto px-4 py-8">
  <div class="mb-6 flex items-center justify-between">
    <h1 class="text-2xl font-bold">All Products</h1>
    <div class="flex items-center gap-2 text-sm">
      <a routerLink="/all-products" [queryParams]="{ view: 'all' }"
         class="rounded-full px-3 py-1.5 text-gray-300 hover:bg-white/5 transition"
         [attr.aria-current]="view() === 'all' ? 'page' : null"
         [ngClass]="view() === 'all' ? ['text-indigo-200','bg-indigo-500/15','ring-2','ring-indigo-500/40','ring-offset-1','ring-offset-gray-900','font-semibold'] : []">All</a>
      <a routerLink="/all-products" [queryParams]="{ view: 'deals' }"
         class="rounded-full px-3 py-1.5 text-gray-300 hover:bg-white/5 transition"
         [attr.aria-current]="view() === 'deals' ? 'page' : null"
         [ngClass]="view() === 'deals' ? ['text-indigo-200','bg-indigo-500/15','ring-2','ring-indigo-500/40','ring-offset-1','ring-offset-gray-900','font-semibold'] : []">Deals</a>
      <a routerLink="/all-products" [queryParams]="{ view: 'trending' }"
         class="rounded-full px-3 py-1.5 text-gray-300 hover:bg-white/5 transition"
         [attr.aria-current]="view() === 'trending' ? 'page' : null"
         [ngClass]="view() === 'trending' ? ['text-indigo-200','bg-indigo-500/15','ring-2','ring-indigo-500/40','ring-offset-1','ring-offset-gray-900','font-semibold'] : []">Trending</a>
      <a routerLink="/all-products" [queryParams]="{ view: 'new' }"
         class="rounded-full px-3 py-1.5 text-gray-300 hover:bg-white/5 transition"
         [attr.aria-current]="view() === 'new' ? 'page' : null"
         [ngClass]="view() === 'new' ? ['text-indigo-200','bg-indigo-500/15','ring-2','ring-indigo-500/40','ring-offset-1','ring-offset-gray-900','font-semibold'] : []">New</a>
    </div>
  </div>

  <!-- STATUS -->
  <!-- STATUS -->
  @if (isLoading()) {
    <p class="text-gray-500">Loading…</p>
  } @else if (error()) {
    <p class="text-red-500 font-medium">{{ error() }}</p>
  } @else {
    @if (visibleProducts().length === 0) {
      <div class="rounded-lg border border-dashed border-white/10 bg-gray-900/40 p-8 text-center text-gray-400">
        No products to show.
      </div>
    } @else {
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-6">
        @for (p of visibleProducts(); track p.id) {
          <app-product-card [product]="p" (add)="addToCart($event)"></app-product-card>
        }
      </div>
    }
  }
</div>
