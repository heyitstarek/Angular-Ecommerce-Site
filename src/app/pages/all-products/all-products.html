<div class="container mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold mb-6">All Products</h1>

  <!-- STATUS -->
  @if (isLoading()) {
    <p class="text-gray-500">Loading…</p>
  } @else if (error()) {
    <p class="text-red-500 font-medium">{{ error() }}</p>
  } @else {
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-6">
      @for (p of products(); track p.id) {
        <article
          class="rounded-lg border bg-white p-4 shadow-sm transition hover:shadow-lg hover:scale-[1.02]">
          <a [routerLink]="['/products', p.id]" class="block group">
            <img [src]="p.thumbnail" [alt]="p.title"
                 class="h-40 w-full object-contain mb-3 transition-transform duration-200 group-hover:scale-105" />
            <h3 class="text-sm font-medium text-gray-900 line-clamp-2 group-hover:text-indigo-600 transition-colors"
                title="{{ p.title }}">
              {{ p.title }}
            </h3>
          </a>
          <div class="mt-2 flex items-center justify-between">
            <div>
              <p class="text-indigo-600 font-semibold">${{ p.price }}</p>
              <p class="text-xs text-gray-500">⭐ {{ p.rating }}</p>
              <p class="text-xs text-green-600">-{{ p.discountPercentage }}%</p>
            </div>
            <button type="button"
                    (click)="addToCart(p)"
                    class="rounded-md bg-indigo-600 px-3 py-1.5 text-sm text-white hover:bg-indigo-700 transition cursor-pointer">
              Add
            </button>
          </div>
        </article>
      }
    </div>
  }
</div>
